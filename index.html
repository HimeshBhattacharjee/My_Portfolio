    <!-- Theme before first paint: saved choice, else the system preference. No flash of the
       wrong theme. Keep the key in step with src/theme/ThemeProvider.jsx. -->
    <script>
        (function () {
            var theme = "dark";
            try {
                var saved = localStorage.getItem("hb-theme");
                theme = saved === "light" || saved === "dark" ? saved
                    : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            } catch (e) { /* storage blocked: fall back to dark */ }
            document.documentElement.setAttribute("data-theme", theme);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", theme === "light" ? "#F4F1EA" : "#0A0B0D");
        })();
    </script>
